[defaults]
kernel = "cachyos-latest"
defaultUser = "borhane"
system = "x86_64-linux"
additionalKernels = ["linux-lts"]
modules = ["fstrim", "fwupd"]

[defaults.users.borhane]

[kamui]
type = "laptop"
description = "P14s G5 AMD"
kernel = "cachyos-latest"

[kamui.features.kernel]
opti = "zen4"

[kamui.hardware]
disk = "/dev/nvme0n1"
ram = 32
cpu = "amd"
gpu = "amd"
nixos-hardware = "lenovo-thinkpad-p14s-amd-gen5"
fingerprint = true

[kamui.hardware.fan]
# band widens each [temp, speed] point into a thinkfan level [speed, temp-band, temp+band];
band = 6
speeds = [[56, 1], [63, 2], [69, 3], [74, 4], [79, 5], [84, 6]]

[kamui.features.thinkfan]
enable = true
# [type, path, name, indices?] tuples; name "" for path-only sensors (tpacpi).
sensors = [
  ["tpacpi", "/proc/acpi/ibm/thermal", "", [1, 2, 3, 4]],
  ["hwmon", "/sys/class/hwmon", "amdgpu", [1]],
  ["hwmon", "/sys/class/hwmon", "k10temp", [1]],
  ["hwmon", "/sys/class/hwmon", "thinkpad", [1, 3, 6, 7]],
  ["hwmon", "/sys/class/hwmon", "nvme", [1]],
  ["hwmon", "/sys/class/hwmon", "acpitz", [1]],
]

[kamui.features.microvm.sandbox]
# [host, guest] share tuples.
shares = [
  ["/home/borhane/.config/nixos", "/host/nixos"],
  ["/home/borhane/Code/share", "/home/borhane/c"],
]

[kotoamatsukami]
hostname = "koto"
type = "desktop"
description = "5950X Workstation"
kernel = "cachyos-latest"
users.borhane.email = "guemidiborhane@aina.dz"

[kotoamatsukami.features]
auto-upgrade = false
remote-unlock = true
netbirdPort = 51281
silo = true
ollama = true

[kotoamatsukami.features.liquidctl]
enable = true
match = "H115i"
sensor = "k10temp.tctl"

[kotoamatsukami.features.kernel]
opti = "x86_64-v3"

[kotoamatsukami.features.wol]
enable = true
iface = "enp6s0"

[kotoamatsukami.hardware]
disk = "/dev/nvme0n1"
ram = 64
cpu = "amd"
gpu = "nvidia"
bluetooth = true
wifi = true
# [uuid, path] mount tuples.
mounts = [
  ["34B1213A561574D4", "/mnt/2_5"],
  ["75cddeb8-910a-41da-8b8c-269dada60016", "/mnt/3_5"],
  ["4d80e49e-7786-4543-aa34-7429908d3c8b", "/mnt/320"],
  ["afe8ba39-fada-43da-ba0a-459498b1b062", "/mnt/LACIE"],
  ["4A9DD7D4448B0F0A", "/mnt/DATA"],
]

[kotoamatsukami.hardware.fan]
# [temp, speed]
speeds = [[0, 0], [40, 0], [50, 25], [60, 40], [70, 60], [85, 100]]

[sandbox]
type = "vm"

[sandbox.hardware]
vcpu = 4
ram = 8

[sandbox.users.borhane]
modules = []
features.ai.opencode = true
features.ai.pi-coding-agent = true
